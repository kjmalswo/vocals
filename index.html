<script>
/*
  데이터 레이어: 기본 데이터는 HTML의 DEFAULT_ARTIST_DB 배열에서 읽고,
  실제 편집 데이터는 브라우저 로컬 저장소에 저장합니다. 외부 JS 파일은 사용하지 않습니다.
*/
const LOCAL_KEY='VOCAL_INDEX_DB';
const DEFAULT_DB_VERSION='2026-09-14-DB21';
const DEFAULT_DB_VERSION_KEY='VOCAL_INDEX_DB_VERSION';
const AXES=[
  {key:'high', label:'고음', cls:'crimson', angle:-90},
  {key:'falsetto', label:'가성', cls:'sky', angle:-30},
  {key:'tone', label:'음색', cls:'gold', angle:30},
  {key:'emotion', label:'감정표현', cls:'yellow', angle:90},
  {key:'low', label:'저음', cls:'lime', angle:150},
  {key:'technique', label:'테크닉', cls:'purple', angle:210}
];
let storageMode='local';
let memoryRows=[];
let artists=[], selectedForMenu=null, compareMode=false, selected=[] , editingId=null;
const $=id=>document.getElementById(id);

// 단일 HTML 배포용 저장 계층. localStorage를 사용할 수 없는 file://·사생활 보호 환경에서도
// 메모리 저장소로 즉시 동작하도록 폴백합니다. 따라서 초기 화면은 저장소 오류 때문에 멈추지 않습니다.
let storageAvailable=false;
try{
  const probe='__vocal_index_probe__';
  localStorage.setItem(probe,'1'); localStorage.removeItem(probe);
  storageAvailable=true;
}catch(_e){ storageAvailable=false; }
try{
  if(storageAvailable){
    const raw=localStorage.getItem(LOCAL_KEY);
    const parsed=raw?JSON.parse(raw):[];
    memoryRows=Array.isArray(parsed)?parsed:[];
  }
}catch(_e){ storageAvailable=false; memoryRows=[]; }
function localRows(){ return Array.isArray(memoryRows)?memoryRows.map(x=>({...x})):[]; }
function saveLocalRows(rows){
  memoryRows=Array.isArray(rows)?rows.map(x=>({...x})):[];
  if(storageAvailable){ try{ localStorage.setItem(LOCAL_KEY,JSON.stringify(memoryRows)); }catch(_e){ storageAvailable=false; } }
}
function getAll(){ return Promise.resolve(localRows()); }
function putArtist(a){
  const rows=localRows();
  let record={...a};
  if(record.id===undefined||record.id===null){record.id=rows.reduce((m,x)=>Math.max(m,Number(x.id)||0),0)+1}
  const idx=rows.findIndex(x=>Number(x.id)===Number(record.id));
  if(idx>=0)rows[idx]=record; else rows.push(record);
  saveLocalRows(rows);
  return Promise.resolve(record.id);
}
function deleteArtist(id){ saveLocalRows(localRows().filter(x=>Number(x.id)!==Number(id))); return Promise.resolve(); }
function replaceAll(rows){ saveLocalRows(rows.map((x,i)=>({...x,id:x.id??(i+1)}))); return Promise.resolve(); }

function avg(a){return Math.round((a.high+a.low+a.falsetto+a.tone+a.technique+a.emotion)/6)}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function point(cx,cy,r,angle){const a=angle*Math.PI/180;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]}
function polygonPoints(a,r){return AXES.map(x=>point(115,107,r*a[x.key]/100,x.angle).join(',')).join(' ')}
function gridPolygon(r){return AXES.map(x=>point(115,107,r,x.angle).join(',')).join(' ')}
function radarSVG(a,large=false){const radii=[30,55,80];const lines=AXES.map(x=>{const p=point(115,107,80,x.angle);return `<line x1="115" y1="107" x2="${p[0]}" y2="${p[1]}" class="axis ${x.cls}"/>`}).join('');const dots=AXES.map(x=>{const p=point(115,107,80*a[x.key]/100,x.angle);return `<circle cx="${p[0]}" cy="${p[1]}" r="3.2" class="dot ${x.cls}"/>`}).join('');return `<svg viewBox="0 0 230 214" aria-label="${esc(a.name)} 보컬 스탯 레이더 차트"><style>.grid{fill:none;stroke:#c8c8c2;stroke-width:1}.axis{stroke:#c8c8c2;stroke-width:1}.axis.crimson,.dot.crimson{stroke:#c73555;fill:#c73555}.axis.lime,.dot.lime{stroke:#9ccd68;fill:#9ccd68}.axis.sky,.dot.sky{stroke:#67b9e8;fill:#67b9e8}.axis.gold,.dot.gold{stroke:#e5a43e;fill:#e5a43e}.axis.purple,.dot.purple{stroke:#a47be5;fill:#a47be5}.axis.yellow,.dot.yellow{stroke:#ead04f;fill:#ead04f}.area{fill:rgba(110,88,180,.18);stroke:#4f5260;stroke-width:2}</style>${radii.map(r=>`<polygon class="grid" points="${gridPolygon(r)}"/>`).join('')}${lines}<polygon class="area" points="${polygonPoints(a,80)}"/>${dots}</svg>`}

async function centerFace(img){
  try{
    if(!('FaceDetector' in window)) return;
    if(!img.naturalWidth || !img.naturalHeight) return;
    const detector=new FaceDetector({fastMode:true,maxDetectedFaces:4});
    const faces=await detector.detect(img);
    if(!faces.length) return;
    const face=faces.sort((a,b)=>(b.boundingBox.width*b.boundingBox.height)-(a.boundingBox.width*a.boundingBox.height))[0];
    const box=face.boundingBox;
    const cx=(box.x+box.width/2)/img.naturalWidth*100;
    const cy=(box.y+box.height/2)/img.naturalHeight*100;
    // 얼굴 중심을 육각형 중앙에 맞추되, 기존보다 넓은 범위를 보여주도록 과도한 확대를 줄입니다.
    // object-position은 감지된 얼굴을 화면 중앙으로 가져오고, scale은 얼굴이 너무 크게 잘리지 않도록 완화합니다.
    const faceRatio=Math.max(box.width/img.naturalWidth,box.height/img.naturalHeight);
    const scale=Math.max(1.15,Math.min(2.25,0.60/Math.max(faceRatio,0.06)));
    img.style.setProperty('--face-x',`${Math.max(8,Math.min(92,cx))}%`);
    img.style.setProperty('--face-y',`${Math.max(8,Math.min(92,cy))}%`);
    img.style.setProperty('--face-scale',scale.toFixed(2));
  }catch(_e){ /* Face Detection 미지원/외부 이미지 제한 시 중앙 크롭 */ }
}

function sortArtists(list){

  const stat=$('statSelect')?.value||'high';

function b64Utf8(text){
  const bytes=new TextEncoder().encode(text);
  let binary='';
  const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk) binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
  return btoa(binary);
}

      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+adminSession},
      body:JSON.stringify({artists:artists.map(x=>({...x}))})
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok){
      const detail=data.detail?` · ${data.detail}`:'';

  }catch(err){

    // 실제 인증 만료인 경우에만 로그아웃 처리합니다.
    // Worker가 GitHub에서 403을 받은 경우에는 관리자 창을 닫지 않습니다.
    if(Number(err.httpStatus)===401){

      $('serverSyncInfo').textContent='관리자 인증이 만료되었습니다. 다시 로그인해주세요.';
    }
  }finally{
    btn.disabled=!adminSession;
  }
}

function mergeDefaults(){
  const defaults=readDefaultDB().map((x,i)=>({...x,id:Number(x.id??(i+1))}));
  const current=localRows();
  let storedVersion='';
  try{storedVersion=localStorage.getItem(DEFAULT_DB_VERSION_KEY)||'';}catch(_e){}
  if(storedVersion!==DEFAULT_DB_VERSION){
    const defaultIds=new Set(defaults.map(x=>Number(x.id)));
    const merged=[...defaults,...current.filter(x=>!defaultIds.has(Number(x.id))).map(x=>({...x}))];
    saveLocalRows(merged);
    try{localStorage.setItem(DEFAULT_DB_VERSION_KEY,DEFAULT_DB_VERSION);}catch(_e){}
    return merged;
  }
  if(!current.length){ saveLocalRows(defaults); try{localStorage.setItem(DEFAULT_DB_VERSION_KEY,DEFAULT_DB_VERSION);}catch(_e){} return defaults; }
  const existingIds=new Set(current.map(x=>Number(x.id)));
  const additions=defaults.filter(x=>!existingIds.has(Number(x.id)));
  if(additions.length){ const merged=[...current,...additions]; saveLocalRows(merged); return merged; }
  return current;
}

      low:['저음','저음역의 깊이와 안정감, 흉성 기반의 울림을 평가하는 축입니다. 높은 점수일수록 낮은 음에서의 중심과 공명 유지가 장점으로 나타납니다.','중저음에서 안정감이 있는 프로필입니다. 낮은 음을 단순히 내는 것보다 음색과 발성의 중심을 유지하는지가 핵심 포인트입니다.'],
      falsetto:['가성','가성·두성 계열의 전환과 음색 제어, 연결감을 평가하는 축입니다. 높은 점수일수록 가벼운 음역으로 이동하면서도 표현력을 유지하기 쉽습니다.','가성 운용이 강점인 프로필입니다. 레지스터 전환을 부드럽게 연결할수록 고음 표현의 선택지가 넓어집니다.'],
      tone:['음색','목소리의 고유한 질감과 색채, 청취 인상과 개성을 평가하는 축입니다. 높은 점수는 기술과 별개로 음색 자체의 식별력이 높다는 뜻으로 볼 수 있습니다.','음색이 이 프로필의 핵심 자산입니다. 곡에 따라 동일한 멜로디도 화자의 고유한 색으로 들리게 만드는 데 유리합니다.'],
      technique:['테크닉','호흡, 발성, 음정, 프레이징, 리듬, 레지스터 연결 등 복합적인 제어 능력을 평가하는 축입니다. 높은 점수일수록 다양한 표현을 안정적으로 구현하기 쉽습니다.','기술적 제어가 강한 프로필입니다. 좋은 표현을 반복해서 재현할 수 있는 안정성 측면에서 장점이 있습니다.'],
      emotion:['감정표현','가사 전달, 다이내믹, 뉘앙스, 프레이징의 감정적 설득력을 평가하는 축입니다. 높은 점수는 단순한 음정 정확도를 넘어 곡의 정서를 전달하는 힘으로 해석됩니다.','감정 전달력이 강점으로 나타납니다. 같은 음정과 리듬을 사용해도 강약과 뉘앙스의 차이로 장면을 만드는 데 유리합니다.']
    };
    return t[key]||['','', ''];
  };
  return {vals,strongest,weakest,balance,avgScore,verdict,getText};
}
function openDetailWindow(a){
  const p=analysisProfile(a);
  const statCards=p.vals.map(v=>{
    const [title,desc,comment]=p.getText(v.key,v.value);
    return `<article class="detail-stat-card stat-${v.key}"><div class="detail-stat-title"><span>${title}</span><b>${v.value}</b></div><div class="meter"><i style="width:${v.value}%"></i></div><p class="detail-stat-desc">${desc}</p><div class="detail-stat-comment">${comment}</div></article>`;
  }).join('');
  const strengths=`<article class="detail-insight" data-tone="strong"><span class="ey">STRONGEST AREAS</span><h3>${esc(p.strongest)}</h3><p>현재 입력된 지표에서 상대적으로 높은 영역입니다. 이 강점들은 선곡, 편곡, 라이브 구성에서 해당 가수의 캐릭터를 드러내는 핵심 요소로 활용될 수 있습니다.</p></article>`;
  const cautions=`<article class="detail-insight" data-tone="watch"><span class="ey">AREAS TO WATCH</span><h3>${esc(p.weakest)}</h3><p>상대적으로 낮게 입력된 영역입니다. 낮은 점수가 반드시 약점을 의미하는 것은 아니며, 평가 기준·곡의 난이도·컨디션에 따라 실제 체감은 달라질 수 있습니다.</p></article>`;
  $('detailContent').innerHTML=`<div class="detail-content-wrap">
    <section class="detail-hero">
      <div class="detail-photo" style="background-image:url('${esc(a.image)}')"></div>
      <div class="detail-identity">
        <div class="detail-kicker">VOCAL PROFILE</div>
        <h1 class="detail-name">${esc(a.name)}</h1>
        <div class="detail-country">${esc(a.country)}</div>
        <div class="detail-score-row"><div class="detail-score">${p.avgScore}</div><div class="detail-score-label">/ 100 OVERALL</div></div>
        <div class="detail-summary-card"><strong>PROFILE SUMMARY</strong>${esc(p.verdict)}<br>${esc(a.note||'이 가수에 등록된 추가 메모가 없습니다.')}</div>
      </div>
    </section>
    <div class="detail-section-head"><h3 class="detail-section-title">강점과 주의 영역</h3><span class="detail-section-sub">현재 입력된 6개 지표 기준</span></div>
    <section class="detail-insights">${strengths}${cautions}</section>
    <div class="detail-section-head"><h3 class="detail-section-title">6개 보컬 스탯</h3><span class="detail-section-sub">영역별 평가 · 설명 · 해석</span></div>
    <section class="detail-stat-grid">${statCards}</section>
    <div class="detail-note-box"><b>평가 해석 안내</b>이 페이지의 수치는 데이터베이스에 입력된 6개 지표를 바탕으로 시각화한 프로필입니다. 실제 보컬 능력은 곡의 키, 편곡, 컨디션, 라이브 환경 및 평가 기준에 따라 달라질 수 있으므로 절대적인 순위나 의학적·과학적 측정치가 아닌 비교용 지표로 활용하세요. 평균 점수는 6개 항목의 단순 평균입니다.</div>
  </div>`;
  $('detailModal').classList.add('show');
}

function readDefaultDB(){
  return Array.isArray(DEFAULT_ARTIST_DB) ? DEFAULT_ARTIST_DB.map(x=>({...x})) : [];
}

function boot(){
  try{
    artists=mergeDefaults();
    render();
    renderDBList();
    $('dbStatus').textContent=`HTML DB · ${artists.length}명 로드 완료${storageAvailable?'':' · 브라우저 임시 저장'}`;
  }catch(err){
    console.error('SINGERS COMPARE boot failed:',err);
    artists=readDefaultDB().map((row,i)=>({...row,id:row.id??(i+1)}));
    render();
    renderDBList();
    $('dbStatus').textContent=`기본 DB · ${artists.length}명`;
  }
}

boot();
</script>
